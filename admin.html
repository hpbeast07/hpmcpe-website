<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HPmcpe Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: white;
        }

        h1 {
            margin-bottom: 25px;
        }

        #loading {
            color: #aaa;
        }

        #denied {
            display: none;
            color: #ff5555;
            font-size: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #181b22;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #292d36;
        }

        th {
            background: #20242d;
        }

        .paid {
            color: #22c55e;
            font-weight: bold;
        }

        .error {
            color: #ef4444;
        }
    </style>
</head>

<body>

    <h1>🛠️ HPmcpe Admin Dashboard</h1>

    <div id="loading">
        Checking admin access...
    </div>

    <div id="denied">
        ❌ Access Denied
    </div>

    <div id="dashboard" style="display:none;">

        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Payment ID</th>
                    <th>Order ID</th>
                    <th>Paid At</th>
                </tr>
            </thead>

            <tbody id="orders">
            </tbody>
        </table>

    </div>

    <script type="module" src="admin.js"></script>

</body>
</html>
